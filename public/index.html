<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparks & Sequins - Smart Wardrobe Planner</title>

  <!-- Browser Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Manifest for PWA -->
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#7c3aed">

  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #7c3aed;
      --primary-light: #f3e8ff;
      --primary-hover: #6d28d9;
      --bg-main: #fafafa;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #f3f4f6;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg-main); 
      color: var(--text-main); 
      display: flex; 
      min-height: 100vh; 
    }

    .sidebar { 
      width: 240px; 
      background: var(--bg-card); 
      border-right: 1px solid var(--border); 
      padding: 1.5rem; 
      display: flex; 
      flex-direction: column; 
      gap: 2rem; 
    }
    .brand { 
      font-size: 1.2rem; 
      font-weight: 800; 
      color: var(--primary); 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }
    .nav-menu { display: flex; flex-direction: column; gap: 6px; list-style: none; }
    .nav-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 10px 14px; 
      border-radius: 12px; 
      color: var(--text-muted); 
      font-size: 0.95rem; 
      font-weight: 500; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .nav-item:hover, .nav-item.active { 
      background: var(--primary-light); 
      color: var(--primary); 
      font-weight: 600; 
    }

    .main-wrapper { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      overflow-y: auto; 
      padding-bottom: 70px; 
    }
    header { 
      background: var(--bg-card); 
      padding: 1rem 1.5rem; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .search-bar { 
      background: var(--bg-main); 
      border: 1px solid var(--border); 
      padding: 8px 16px; 
      border-radius: 20px; 
      width: 280px; 
      font-size: 0.9rem; 
    }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

    .content { padding: 1.5rem; max-width: 1100px; margin: 0 auto; width: 100%; }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .page-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; }
    .chip-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1.25rem; }
    .chip { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      padding: 8px 18px; 
      border-radius: 20px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: var(--text-muted); 
      cursor: pointer; 
      white-space: nowrap; 
    }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .card { 
      background: var(--bg-card); 
      border-radius: var(--radius); 
      overflow: hidden; 
      border: 1px solid var(--border); 
      box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
    }
    .card img { width: 100%; height: 170px; object-fit: cover; background: #f0f0f0; }
    .card-body { padding: 10px; }
    .card-title { font-size: 0.85rem; font-weight: 600; }
    .card-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .style-card { 
      background: var(--bg-card); 
      border-radius: var(--radius); 
      padding: 1.5rem; 
      border: 1px solid var(--border); 
      margin-bottom: 1rem; 
    }
    .option-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 10px; }

      background: var(--bg-main);
