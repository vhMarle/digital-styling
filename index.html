<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleNest - Smart Wardrobe Planner</title>
  
  <!-- PWA Manifest & Theme Color -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c3aed">

  <style>
    :root {
      --primary: #7c3aed;
      --primary-light: #f3e8ff;
      --primary-hover: #6d28d9;
      --bg-main: #fafafa;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #f3f4f6;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg-main); 
      color: var(--text-main); 
      display: flex; 
      min-height: 100vh; 
    }

    /* Desktop Sidebar Navigation */
    .sidebar { 
      width: 240px; 
      background: var(--bg-card); 
      border-right: 1px solid var(--border); 
      padding: 1.5rem; 
      display: flex; 
      flex-direction: column; 
      gap: 2rem; 
    }
    .brand { 
      font-size: 1.25rem; 
      font-weight: 800; 
      color: var(--primary); 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }
    .nav-menu { display: flex; flex-direction: column; gap: 6px; list-style: none; }
    .nav-item { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 10px 14px; 
      border-radius: 12px; 
      color: var(--text-muted); 
      font-size: 0.95rem; 
      font-weight: 500; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .nav-item:hover, .nav-item.active { 
      background: var(--primary-light); 
      color: var(--primary); 
      font-weight: 600; 
    }

    /* Main Content Area */
    .main-wrapper { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      overflow-y: auto; 
      padding-bottom: 70px; 
    }
    header { 
      background: var(--bg-card); 
      padding: 1rem 1.5rem; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .search-bar { 
      background: var(--bg-main); 
      border: 1px solid var(--border); 
      padding: 8px 16px; 
      border-radius: 20px; 
      width: 280px; 
      font-size: 0.9rem; 
    }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

    .content { padding: 1.5rem; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* View Sections */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* General UI Elements */
    .page-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1rem; }
    .chip-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 1.25rem; }
    .chip { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      padding: 8px 18px; 
      border-radius: 20px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: var(--text-muted); 
      cursor: pointer; 
      white-space: nowrap; 
    }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Closet Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .card { 
      background: var(--bg-card); 
      border-radius: var(--radius); 
      overflow: hidden; 
      border: 1px
